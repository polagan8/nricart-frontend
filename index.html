<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRICart - Authentic Indian Pickles & Groceries</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- PROFESSIONAL, CLEAN CSS --- */
        :root {
            --primary: #D4A574; --primary-dark: #B8935F; --secondary: #8B4513;
            --accent: #FF6B35; --text-dark: #2C1810; --text-light: #6B5B4F;
            --bg-cream: #FFF8F0; --white: #FFFFFF; --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-cream); color: var(--text-dark); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        
        /* Header */
        header { background: var(--white); padding: 20px 5%; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: 800; color: var(--secondary); }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 30px; font-weight: 600; }
        .nav-links a:hover { color: var(--accent); }
        .cart-btn { background: var(--accent); color: white; padding: 10px 20px; border-radius: 50px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; border: none; }

        /* Hero Section */
        .hero { text-align: center; padding: 80px 20px; background: linear-gradient(135deg, #FFF5EB 0%, #FFE8D6 100%); }
        .hero h1 { font-size: 48px; font-weight: 800; margin-bottom: 20px; color: var(--text-dark); }
        .hero h1 span { color: var(--accent); }
        .hero p { font-size: 18px; color: var(--text-light); max-width: 600px; margin: 0 auto 30px; }
        .hero-btn { background: var(--secondary); color: white; padding: 15px 40px; border-radius: 50px; font-weight: 700; font-size: 16px; transition: 0.3s; }
        .hero-btn:hover { background: var(--accent); transform: translateY(-2px); }

        /* Products Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
        .section-title { text-align: center; font-size: 32px; font-weight: 800; margin-bottom: 40px; color: var(--secondary); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        
        .product-card { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); transition: transform 0.3s ease; border: 1px solid #f0e6dc; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .product-img { height: 220px; width: 100%; object-fit: cover; background: #f9f9f9; }
        .product-info { padding: 20px; }
        .product-cat { font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .product-title { font-size: 18px; font-weight: 700; margin: 8px 0; color: var(--text-dark); }
        .product-desc { font-size: 14px; color: var(--text-light); margin-bottom: 15px; height: 40px; overflow: hidden; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .price { font-size: 22px; font-weight: 800; color: var(--secondary); }
        .old-price { font-size: 14px; color: #999; text-decoration: line-through; margin-left: 5px; }
        .add-btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .add-btn:hover { background: var(--primary-dark); }

        /* Loading State */
        #loading { text-align: center; font-size: 18px; color: var(--text-light); padding: 40px; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">NRI<span>Cart</span></div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Pickles</a>
            <a href="#">Spices</a>
            <a href="#">Groceries</a>
        </nav>
        <button class="cart-btn"><i class="fas fa-shopping-bag"></i> Cart (<span id="cart-count">0</span>)</button>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Authentic Indian <span>Tastes</span>,<br>Delivered Worldwide.</h1>
        <p>Handcrafted pickles, premium spices, and essential groceries shipped directly to NRIs across the globe.</p>
        <a href="#products" class="hero-btn">Shop Now</a>
    </section>

    <!-- Products -->
    <section class="container" id="products">
        <h2 class="section-title">Bestselling Products</h2>
        <div id="loading">Loading fresh products from our kitchen...</div>
        <div class="products-grid" id="products-grid"></div>
    </section>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
               // 1. CONFIGURATION (REPLACE WITH YOUR KEYS)
        const SUPABASE_URL = 'https://vzsmqzovlgasnoynpjbr.supabase.co'; // Removed /rest/v1/
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6c21xem92bGdhc25veW5wamJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Njg2MzgsImV4cCI6MjEwNTE0NDYzOH0.Xk6vQppLeH52QQLeFEvhtx9C4ngpVmj4e77c6y3qpX4';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cartCount = 0;

        // 2. FETCH PRODUCTS
        async function loadProducts() {
            const { data: products, error } = await supabase
                .from('products')
                .select('*')
                .eq('is_active', true);

            const loadingDiv = document.getElementById('loading');
            const grid = document.getElementById('products-grid');

            if (error) {
                loadingDiv.innerText = 'Error loading products. Check console.';
                console.error('Supabase Error:', error);
                return;
            }

            loadingDiv.style.display = 'none';

            if (!products || products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No products available yet.</p>';
                return;
            }

            // Render Cards
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image_url}" alt="${p.name}" class="product-img">
                    <div class="product-info">
                        <div class="product-cat">${p.category}</div>
                        <h3 class="product-title">${p.name}</h3>
                        <p class="product-desc">${p.description}</p>
                        <div class="product-footer">
                            <div>
                                <span class="price">$${p.price}</span>
                                ${p.original_price ? `<span class="old-price">$${p.original_price}</span>` : ''}
                            </div>
                            <button class="add-btn" onclick="addToCart()">Add</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 3. CART LOGIC
        function addToCart() {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            // In a real app, this would save to Supabase 'cart' table
            alert('Added to cart! (Checkout logic coming in next step)');
        }

        // Initialize
        loadProducts();
    </script>
</body>
</html>
